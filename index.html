<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaceCheck | Control de Asistencia</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main class="panel">
      <!-- Columna izquierda: logo e imagen del trabajador -->
      <section class="columna-usuario">
        <p class="logo">FaceCheck</p>
        <div class="usuario">Foto del trabajador</div>
      </section>

      <!-- Columna derecha: fecha, escáner y registro -->
      <section class="columna-escaner">
        <p id="fecha">Fecha actual</p>

        <div class="registro">
          <label for="dni">Ingresa tu DNI</label>
          <input type="text" id="dni" maxlength="8" inputmode="numeric" />

          <div class="botones">
            <button type="button" id="btnEntrada">Entrada</button>
            <button type="button" id="btnSalida">Salida</button>
          </div>
        </div>

        <div class="escaner">Coloca tu rostro dentro del marco</div>

        <p id="mensaje"></p>
      </section>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
